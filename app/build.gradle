// AndroidX Media3 background playback; AndroidX is enabled in root gradle.properties
plugins { id 'com.android.application' }
android {
    namespace 'com.nasflix.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nasflix.app'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '1.2.2'
    }

    // Release signing is supplied only through GitHub Actions secrets.
    def releaseStoreFile = System.getenv('NASFLIX_KEYSTORE_FILE')
    def releaseStorePassword = System.getenv('NASFLIX_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('NASFLIX_KEY_ALIAS')
    if (releaseStoreFile && releaseStorePassword && releaseKeyAlias) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storeType 'PKCS12'
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseStorePassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
            }
        }
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.annotation:annotation:1.9.1'
}
