    namespace 'com.nasflix.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nasflix.app'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    dependencies {
        implementation 'androidx.media3:media3-exoplayer:1.5.1'
        implementation 'androidx.media3:media3-session:1.5.1'
    }
}
