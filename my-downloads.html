<main class="download-page"><p class="eyebrow">AVAILABLE WITHOUT INTERNET</p><h1>My <em>Downloads</em></h1><div class="downloads-heading"><p class="eyebrow">YOUR OFFLINE LIBRARY</p><h1>My <em>Downloads</em></h1><span id="downloadsCount">Saved media</span></div><div class="downloads-grid" id="downloadsGrid" hidden></div><div class="empty-state" id="downloadsEmpty">Loading saved files…</div><div class="page-auth" id="pageAuth" hidden><a href="index.html">Go to Login / Sign up</a></div><section class="player offline-player-card" id="offlinePlayer" hidden><div class="offline-player-backdrop" id="offlinePlayerBackdrop"></div><div class="offline-player-shell"><div class="offline-player-toolbar"><b id="offlinePlayerTitle">Now playing</b><div class="offline-player-actions"><button type="button" id="offlinePlayerMinimize" aria-label="Minimize player">−</button><button type="button" id="offlinePlayerClose" aria-label="Close player">×</button></div></div><div class="offline-player-content" id="offlinePlayerContent"></div><div class="offline-player-controls" id="offlinePlayerControls"><button type="button" id="offlinePlayPause" aria-label="Play or pause">▶</button><span id="offlineCurrentTime">0:00</span><input id="offlineSeek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="offlineDuration">0:00</span><button type="button" id="offlineFullscreen" aria-label="Fullscreen" hidden>⛶</button></div><div class="offline-mini-controls" id="offlineMiniControls"><button type="button" id="offlineMiniPlay" aria-label="Play or pause">▶</button><span id="offlineMiniTime">0:00</span><div class="offline-mini-progress"><span id="offlineMiniProgress"></span></div></div></section></main>

<script>
"use strict";
const $=s=>document.querySelector(s),cacheName="nasflix-offline-media-v1";
let user=null,folder="all",saved=[];
const empty=$("#downloadsEmpty"),grid=$("#downloadsGrid");
function setMessage(message){if(empty){empty.textContent=message;empty.hidden=false;}if(grid)grid.hidden=true;}
function loadSaved(){
 try{
  const raw=localStorage.getItem("nasflix-offline-items");
  const data=raw?JSON.parse(raw):[];
  saved=Array.isArray(data)?data:[];
 }catch(error){saved=[];setMessage("Unable to read saved downloads on this device.");console.error("NASFLIX downloads storage:",error);return;}
 render();
}
async function checkUser(){
 loadSaved();
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),3500);
 try{
  const r=await fetch("/api/account/me",{credentials:"same-origin",cache:"no-store",signal:controller.signal});
  if(r.ok){const d=await r.json();user=d.user||null;}
 }catch(error){console.warn("NASFLIX account check unavailable:",error);}
 finally{
  clearTimeout(timeout);
  $("#pageLogin").hidden=!!user;
  $("#pageLogout").hidden=!user;
  $("#pageAuth").hidden=!!user;
  loadSaved();
 }
}
function artwork(x){
 const src=x.poster_url||x.thumbnail||"";
 if(src)return '<img src="'+esc(src)+'" alt="" loading="lazy" onerror="this.remove()">';
 const title=String(x.episodeTitle||x.title||"NASFLIX"),initials=title.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
 return '<span class="offline-art-fallback">'+esc(initials||"♫")+'</span>';
}
function render(){
 if(!grid||!empty)return;
 const type=x=>String(x.type||"").toLowerCase();
 const list=saved.filter(x=>{
  const t=type(x),matchFolder=folder==="all"||(folder==="music"?t==="music":folder==="series"?t==="series":folder==="movies"?t==="movie":folder==="videos"?(t==="ai video"||t==="video"):false);
  const q=($("#downloadsSearch")?.value||"").trim().toLowerCase(),matchQuery=!q||[x.title,x.episodeTitle,x.artist,x.seriesTitle,x.genre,x.type].some(v=>String(v||"").toLowerCase().includes(q));
  return matchFolder&&matchQuery;
 });
 grid.innerHTML=list.map(x=>'<article class="offline-track"><div class="offline-track-art">'+artwork(x)+'</div><div class="offline-track-info"><b>'+esc(x.episodeTitle||x.title)+'</b><small>'+esc(x.artist||x.seriesTitle||x.genre||x.type||"NASFLIX")+' · '+esc(x.type)+'</small></div><button class="offline-track-play" type="button" data-play="'+encodeURIComponent(x.id)+'" aria-label="Play offline">▶</button><button class="offline-track-delete" type="button" data-delete="'+encodeURIComponent(x.id)+'" aria-label="Remove download">×</button></article>').join("");
 grid.hidden=list.length===0;
 empty.hidden=list.length>0;
 empty.textContent=list.length?"":"No offline media saved in this folder yet.";
 document.querySelectorAll("#downloadsTabs [data-folder]").forEach(b=>b.classList.toggle("active",b.dataset.folder===folder));$("#downloadsCount").textContent=list.length+" saved "+(list.length===1?"item":"items");
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.querySelectorAll("#downloadsTabs [data-folder]").forEach(b=>b.addEventListener("click",()=>{folder=b.dataset.folder;render();}));
$("#downloadsSearch").addEventListener("input",render);
$("#menuToggle").addEventListener("click",()=>{const nav=$("#mainNav"),open=nav.classList.toggle("open");$("#menuToggle").setAttribute("aria-expanded",String(open));});
document.querySelectorAll("#nasBottomNav [data-bottom-page]").forEach(b=>b.addEventListener("click",()=>{const target=b.dataset.bottomPage;if(target==="home")location.href="index.html";else if(target==="music")location.href="index.html#music";else if(target==="search"){const q=$("#downloadsSearch");q.focus();q.scrollIntoView({behavior:"smooth",block:"center"});}else location.href="index.html#playlists";}));
grid.addEventListener("click",async e=>{
 const del=e.target.closest("[data-delete]");
 if(del){
  const id=decodeURIComponent(del.dataset.delete),item=saved.find(x=>String(x.id)===id);
  if(item?.url){try{const c=await caches.open(cacheName);await c.delete(new URL(item.url,location.href).href);}catch(error){console.warn("Could not remove cached file:",error);}}
  saved=saved.filter(x=>String(x.id)!==id);try{localStorage.setItem("nasflix-offline-items",JSON.stringify(saved));}catch{}
  render();return;
 }
 const play=e.target.closest("[data-play]");
 if(play){
  const item=saved.find(x=>String(x.id)===decodeURIComponent(play.dataset.play));if(!item)return;
  try{
   const c=await caches.open(cacheName),res=await c.match(new URL(item.url,location.href).href);
   if(!res)throw new Error("This file is not in offline storage anymore.");
   const blob=await res.blob(),url=URL.createObjectURL(blob),el=document.createElement(String(item.type).toLowerCase()==="music"?"audio":"video");
   el.controls=false;el.autoplay=true;el.playsInline=true;el.src=url;const player=$("#offlinePlayer"),content=$("#offlinePlayerContent");$("#offlinePlayerTitle").textContent=item.episodeTitle||item.title||"Now playing";content.replaceChildren(el);player.hidden=false;player.classList.remove("minimized");$("#offlinePlayerMinimize").textContent="−";$("#offlineFullscreen").hidden=el.tagName!=="VIDEO";el.addEventListener("loadedmetadata",syncOfflineControls);el.addEventListener("timeupdate",syncOfflineControls);el.addEventListener("play",syncOfflineControls);el.addEventListener("pause",syncOfflineControls);el.addEventListener("ended",()=>{syncOfflineControls();URL.revokeObjectURL(url);},{once:true});player.scrollIntoView({behavior:"smooth",block:"center"});el.play().catch(()=>syncOfflineControls());syncOfflineControls();
  }catch(error){alert(error.message||"Unable to play this saved file.");}
 }
});
function offlineMedia(){return $("#offlinePlayerContent").querySelector("audio,video");}
function fmtTime(value){if(!Number.isFinite(value))return "0:00";const n=Math.max(0,Math.floor(value));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");}
function syncOfflineControls(){const media=offlineMedia();if(!media)return;const duration=Number.isFinite(media.duration)?media.duration:0,progress=duration?media.currentTime/duration:0;$("#offlinePlayPause").textContent=media.paused?"▶":"Ⅱ";$("#offlineMiniPlay").textContent=media.paused?"▶":"Ⅱ";$("#offlineCurrentTime").textContent=fmtTime(media.currentTime);$("#offlineDuration").textContent=fmtTime(duration);$("#offlineSeek").value=Math.round(progress*1000);$("#offlineMiniTime").textContent=fmtTime(media.currentTime);$("#offlineMiniProgress").style.width=(progress*100)+"%";}
$("#offlinePlayPause").addEventListener("click",()=>{const m=offlineMedia();if(m){m.paused?m.play().catch(()=>{}):m.pause();syncOfflineControls();}});
$("#offlineMiniPlay").addEventListener("click",()=>$("#offlinePlayPause").click());
$("#offlineSeek").addEventListener("input",e=>{const m=offlineMedia();if(m&&Number.isFinite(m.duration))m.currentTime=m.duration*(Number(e.target.value)/1000);});
$("#offlineFullscreen").addEventListener("click",()=>{const v=offlineMedia();if(v?.requestFullscreen)v.requestFullscreen().catch(()=>{});else if(v?.webkitEnterFullscreen)v.webkitEnterFullscreen();});
function toggleOfflinePlayer(){const player=$("#offlinePlayer"),mini=player.classList.toggle("minimized");$("#offlinePlayerMinimize").textContent=mini?"↗":"−";if(!mini)player.scrollIntoView({behavior:"smooth",block:"center"});}
$("#offlinePlayerMinimize").addEventListener("click",toggleOfflinePlayer);
$("#offlinePlayerTitle").addEventListener("click",()=>{if($("#offlinePlayer").classList.contains("minimized"))toggleOfflinePlayer();});
$("#offlinePlayerClose").addEventListener("click",()=>{const player=$("#offlinePlayer"),media=player.querySelector("audio,video");if(media){media.pause();media.removeAttribute("src");media.load();}$("#offlinePlayerContent").replaceChildren();player.hidden=true;player.classList.remove("minimized");});
$("#pageLogin").addEventListener("click",()=>location.href="index.html?auth=login");
$("#pageLogout").addEventListener("click",async()=>{try{await fetch("/api/account/logout",{method:"POST",credentials:"same-origin"});}catch{}location.reload();});
window.addEventListener("pageshow",loadSaved);
window.addEventListener("storage",e=>{if(e.key==="nasflix-offline-items")loadSaved();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadSaved();});
try{checkUser();}catch(error){console.error("NASFLIX My Downloads failed to initialize:",error);setMessage("Could not load saved files. Please refresh this page.");}
</script></body></html>
