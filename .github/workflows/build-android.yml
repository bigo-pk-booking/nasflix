name: Build NASFLIX Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare release signing key
        env:
          NASFLIX_KEYSTORE_BASE64: ${{ secrets.NASFLIX_KEYSTORE_BASE64 }}
          NASFLIX_KEYSTORE_PASSWORD: ${{ secrets.NASFLIX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NASFLIX_KEYSTORE_BASE64"
          test -n "$NASFLIX_KEYSTORE_PASSWORD"
          mkdir -p "$RUNNER_TEMP/nasflix-signing"
          printf '%s' "$NASFLIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nasflix-signing/release.p12"
          KEY_ALIAS="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/nasflix-signing/release.p12" -storepass "$NASFLIX_KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          echo "NASFLIX_KEYSTORE_FILE=$RUNNER_TEMP/nasflix-signing/release.p12" >> "$GITHUB_ENV"
          echo "NASFLIX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NASFLIX_KEYSTORE_PASSWORD=$NASFLIX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NASFLIX-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
