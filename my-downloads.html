<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090811"><title>My Downloads — NASFLIX</title><link rel="stylesheet" href="styles.css?v=20261108-downloadfloatfix2"><style>
.download-page{max-width:1180px;margin:0 auto;padding:42px 24px 90px}.download-page .eyebrow{color:#c5a4ff;letter-spacing:.22em;font-weight:800}.download-page h1{font-size:clamp(42px,7vw,76px);margin:10px 0 42px}.download-page h1 em{color:#ad80ff;font-style:normal}.download-page .download-folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.download-page .download-folder{min-height:190px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px;border:1px solid #4c3560;border-radius:28px;background:linear-gradient(145deg,#1d1428,#120e1b);color:#f7efff}.download-page .download-folder.active{border-color:#c18aff;box-shadow:0 0 0 2px #9d61d5}.download-page .download-folder span{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#9147ec,#c02bd0);font-size:32px}.download-page .download-folder b{font-size:25px}.download-page .download-folder small{font-size:15px;color:#a99ab8}.download-page .downloads-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:28px}.download-page .download-card{display:flex;justify-content:space-between;gap:12px;padding:18px;border:1px solid #493456;border-radius:18px;background:#171120;color:#f5eaff}.download-page .download-card-main{display:grid;gap:8px;cursor:pointer;min-width:0}.download-page .download-card-main b{overflow-wrap:anywhere}.download-page .download-card small{color:#a99ab8}.download-page .download-card button{align-self:start;border:0;background:transparent;color:#e5caff;font-size:25px}.download-page .download-type{font-size:11px;color:#c59cff;text-transform:uppercase}.download-page .download-play{font-size:13px;color:#c69aff}.download-page .empty-state{margin:80px auto 0;max-width:760px;text-align:center;font-size:clamp(18px,3vw,28px);line-height:1.55;color:#aaa0b5}.download-page .page-auth{margin-top:34px;text-align:center}.download-page .page-auth button,.download-page .page-auth a{display:inline-block;margin:5px;padding:12px 20px;border-radius:999px;border:1px solid #9861c9;background:#3d2250;color:white;text-decoration:none}.download-page .player{margin-top:24px}.download-page .player video,.download-page .player audio{width:100%;max-height:65vh}
.download-page .offline-player-card{position:relative;margin-top:24px;padding:12px;border:1px solid #8056ad;border-radius:18px;background:#171120;box-shadow:0 12px 32px #0008}
.download-page .offline-player-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 12px}
.download-page .offline-player-toolbar>b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f5eaff;font-size:14px}
.download-page .offline-player-actions{display:flex;gap:8px;flex-shrink:0}
.download-page .offline-player-actions button{width:38px;height:38px;border:1px solid #604477;border-radius:50%;background:#251831;color:#e9d4ff;font-size:24px;line-height:1}
.download-page .offline-player-content video,.download-page .offline-player-content audio{display:block;width:100%;max-height:60vh;border-radius:12px;background:#050409}
.download-page .offline-player-card.minimized .offline-player-content{display:none}
/* Floating mini-player stays above the page while browsing downloads */
.download-page .offline-player-card.minimized{position:fixed;z-index:1200;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:auto;max-width:680px;margin:0 auto;padding:10px 12px;border:1px solid #a66be0;border-radius:18px;background:rgba(27,18,39,.97);box-shadow:0 8px 30px #000b;backdrop-filter:blur(16px)}
.download-page .offline-player-card.minimized .offline-player-toolbar{padding:0;min-height:42px}
.download-page .offline-player-card.minimized .offline-player-toolbar>b{font-size:13px;flex:1}
.download-page .offline-player-card.minimized .offline-player-actions button{width:38px;height:38px}
.download-page .offline-player-card.minimized #offlinePlayerMinimize{font-size:0}
.download-page .offline-player-card.minimized #offlinePlayerMinimize::before{content:"↗";font-size:20px}
.download-page .offline-player-card.minimized #offlinePlayerClose{font-size:22px}
.download-page .offline-player-card.minimized #offlinePlayerTitle{cursor:pointer}
@media(max-width:520px){.download-page .offline-player-card.minimized{left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));}}

.download-page .back-home{color:#c7a2f2;text-decoration:none}@media(max-width:650px){.download-page{padding:28px 16px 70px}.download-page .download-folders{gap:9px}.download-page .download-folder{min-height:145px;padding:14px;border-radius:19px}.download-page .download-folder span{width:48px;height:48px;border-radius:15px;font-size:23px}.download-page .download-folder b{font-size:18px}.download-page .download-folder small{font-size:11px}}
</style></head><body>
<header class="topbar"><div class="topbar-inner"><button class="menu-toggle" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button><a class="brand" href="index.html"><span class="brand-mark">N</span> NAS<span>FLIX</span></a><div class="header-actions"><a class="back-home" href="index.html">Home</a><button id="pageLogin" class="header-login">Log in</button><button id="pageLogout" class="header-logout" hidden>Log out</button></div></div><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="download.html">Download App</a><a class="active" href="my-downloads.html">My Downloads</a><a href="index.html#movies">Movies</a><a href="index.html#videos">AI Videos</a><a href="index.html#series">Series</a><a href="index.html#music">Music</a></nav></header>
<main class="download-page"><p class="eyebrow">AVAILABLE WITHOUT INTERNET</p><h1>My <em>Downloads</em></h1><div class="download-folders"><button class="download-folder active" data-folder="all"><span>▦</span><b>All</b><small>Everything saved</small></button><button class="download-folder" data-folder="music"><span>♫</span><b>Music</b><small>Saved songs</small></button><button class="download-folder" data-folder="videos"><span>▣</span><b>Videos</b><small>Saved videos &amp; series</small></button></div><div class="downloads-grid" id="downloadsGrid" hidden></div><div class="empty-state" id="downloadsEmpty">Loading saved files…</div><div class="page-auth" id="pageAuth" hidden><a href="index.html">Go to Login / Sign up</a></div><section class="player offline-player-card" id="offlinePlayer" hidden><div class="offline-player-toolbar"><b id="offlinePlayerTitle">Now playing</b><div class="offline-player-actions"><button type="button" id="offlinePlayerMinimize" aria-label="Minimize player">−</button><button type="button" id="offlinePlayerClose" aria-label="Close player">×</button></div></div><div class="offline-player-content" id="offlinePlayerContent"></div></section></main>
<script>
"use strict";
const $=s=>document.querySelector(s),cacheName="nasflix-offline-media-v1";
let user=null,folder="all",saved=[];
const empty=$("#downloadsEmpty"),grid=$("#downloadsGrid");
function setMessage(message){if(empty){empty.textContent=message;empty.hidden=false;}if(grid)grid.hidden=true;}
function loadSaved(){
 try{
  const raw=localStorage.getItem("nasflix-offline-items");
  const data=raw?JSON.parse(raw):[];
  saved=Array.isArray(data)?data:[];
 }catch(error){saved=[];setMessage("Unable to read saved downloads on this device.");console.error("NASFLIX downloads storage:",error);return;}
 render();
}
async function checkUser(){
 loadSaved();
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),3500);
 try{
  const r=await fetch("/api/account/me",{credentials:"same-origin",cache:"no-store",signal:controller.signal});
  if(r.ok){const d=await r.json();user=d.user||null;}
 }catch(error){console.warn("NASFLIX account check unavailable:",error);}
 finally{
  clearTimeout(timeout);
  $("#pageLogin").hidden=!!user;
  $("#pageLogout").hidden=!user;
  $("#pageAuth").hidden=!!user;
  loadSaved();
 }
}
function render(){
 if(!grid||!empty)return;
 const list=saved.filter(x=>folder==="all"||(folder==="music"?String(x.type||"").toLowerCase()==="music":String(x.type||"").toLowerCase()!=="music"));
 grid.innerHTML=list.map(x=>'<div class="download-card"><div class="download-card-main" data-play="'+encodeURIComponent(x.id)+'"><span class="download-type">'+esc(x.type)+'</span><b>'+esc(x.episodeTitle||x.title)+'</b><small>'+esc(x.seriesTitle||x.genre||"NASFLIX")+'</small><span class="download-play">▶ Play offline</span></div><button data-delete="'+encodeURIComponent(x.id)+'" aria-label="Delete download">×</button></div>').join("");
 grid.hidden=list.length===0;
 empty.hidden=list.length>0;
 empty.textContent=list.length?"":"No offline media saved in this folder yet.";
 document.querySelectorAll("[data-folder]").forEach(b=>b.classList.toggle("active",b.dataset.folder===folder));
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.querySelectorAll("[data-folder]").forEach(b=>b.addEventListener("click",()=>{folder=b.dataset.folder;render();}));
grid.addEventListener("click",async e=>{
 const del=e.target.closest("[data-delete]");
 if(del){
  const id=decodeURIComponent(del.dataset.delete),item=saved.find(x=>String(x.id)===id);
  if(item?.url){try{const c=await caches.open(cacheName);await c.delete(new URL(item.url,location.href).href);}catch(error){console.warn("Could not remove cached file:",error);}}
  saved=saved.filter(x=>String(x.id)!==id);try{localStorage.setItem("nasflix-offline-items",JSON.stringify(saved));}catch{}
  render();return;
 }
 const play=e.target.closest("[data-play]");
 if(play){
  const item=saved.find(x=>String(x.id)===decodeURIComponent(play.dataset.play));if(!item)return;
  try{
   const c=await caches.open(cacheName),res=await c.match(new URL(item.url,location.href).href);
   if(!res)throw new Error("This file is not in offline storage anymore.");
   const blob=await res.blob(),url=URL.createObjectURL(blob),el=document.createElement(String(item.type).toLowerCase()==="music"?"audio":"video");
   el.controls=true;el.autoplay=true;el.playsInline=true;el.src=url;const player=$("#offlinePlayer"),content=$("#offlinePlayerContent");$("#offlinePlayerTitle").textContent=item.episodeTitle||item.title||"Now playing";content.replaceChildren(el);player.hidden=false;player.classList.remove("minimized");$("#offlinePlayerMinimize").textContent="−";player.scrollIntoView({behavior:"smooth",block:"center"});
   el.addEventListener("ended",()=>URL.revokeObjectURL(url),{once:true});
  }catch(error){alert(error.message||"Unable to play this saved file.");}
 }
});
function toggleOfflinePlayer(){const player=$("#offlinePlayer"),mini=player.classList.toggle("minimized");$("#offlinePlayerMinimize").textContent=mini?"↗":"−";if(!mini)player.scrollIntoView({behavior:"smooth",block:"center"});}
$("#offlinePlayerMinimize").addEventListener("click",toggleOfflinePlayer);
$("#offlinePlayerTitle").addEventListener("click",()=>{if($("#offlinePlayer").classList.contains("minimized"))toggleOfflinePlayer();});
$("#offlinePlayerClose").addEventListener("click",()=>{const player=$("#offlinePlayer"),media=player.querySelector("audio,video");if(media){media.pause();media.removeAttribute("src");media.load();}$("#offlinePlayerContent").replaceChildren();player.hidden=true;player.classList.remove("minimized");});
$("#pageLogin").addEventListener("click",()=>location.href="index.html?auth=login");
$("#pageLogout").addEventListener("click",async()=>{try{await fetch("/api/account/logout",{method:"POST",credentials:"same-origin"});}catch{}location.reload();});
window.addEventListener("pageshow",loadSaved);
window.addEventListener("storage",e=>{if(e.key==="nasflix-offline-items")loadSaved();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadSaved();});
try{checkUser();}catch(error){console.error("NASFLIX My Downloads failed to initialize:",error);setMessage("Could not load saved files. Please refresh this page.");}
</script></body></html>
