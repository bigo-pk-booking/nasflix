name: Build NASFLIX Android APK
# Trigger release build with the newly configured signing key
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare release signing key
        env:
          NASFLIX_KEYSTORE_BASE64: ${{ secrets.NASFLIX_KEYSTORE_BASE64 }}
          NASFLIX_KEYSTORE_PASSWORD: ${{ secrets.NASFLIX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NASFLIX_KEYSTORE_BASE64"
          test -n "$NASFLIX_KEYSTORE_PASSWORD"
          mkdir -p "$RUNNER_TEMP/nasflix-signing"
          printf '%s' "$NASFLIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nasflix-signing/release.p12"
          KEY_ALIAS="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/nasflix-signing/release.p12" -storepass "$NASFLIX_KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          echo "NASFLIX_KEYSTORE_FILE=$RUNNER_TEMP/nasflix-signing/release.p12" >> "$GITHUB_ENV"
          echo "NASFLIX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NASFLIX_KEYSTORE_PASSWORD=$NASFLIX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NASFLIX-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nasflix-v1.2.2-release-20261108
          name: NASFLIX v1.2.2 - Signed Android APK
          body: |
            Signed NASFLIX Android release APK.
            Download the APK below and install it on your Android device.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
